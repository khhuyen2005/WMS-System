<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập | XONXEN SHOP</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f0f4f8] min-h-screen flex items-center justify-center font-sans">

    <div class="bg-white p-10 rounded-xl shadow-lg w-[420px]">
        <h2 class="text-[26px] font-bold text-center text-slate-800 mb-8">Đăng nhập</h2>

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="mb-5">
                <label class="block text-sm font-bold text-slate-700 mb-2">Tài khoản</label>
                <input type="text" name="username" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" placeholder="Nhập tài khoản" required autofocus>
            </div>

            <div class="mb-2">
                <label class="block text-sm font-bold text-slate-700 mb-2">Mật khẩu</label>
                <input type="password" name="password" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" placeholder="********" required>
            </div>

            <!-- Nút Quên mật khẩu -->
            <div class="flex justify-end mb-6">
                <a href="{% url 'password_reset' %}" class="text-sm font-medium text-blue-500 hover:text-blue-700 hover:underline">Quên mật khẩu?</a>
            </div>

            {% if form.errors %}
            <p class="text-sm text-red-500 mb-4 text-center">Tài khoản hoặc mật khẩu không chính xác.</p>
            {% endif %}

            <button type="submit" class="w-full bg-[#ea4335] hover:bg-[#d33426] text-white font-bold py-3 px-4 rounded-lg transition duration-200">
                Đăng nhập
            </button>
        </form>
    </div>

</body>
</html>
