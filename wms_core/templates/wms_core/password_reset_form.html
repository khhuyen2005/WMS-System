<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quên mật khẩu | XONXEN SHOP</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f0f4f8] min-h-screen flex items-center justify-center">
    <div class="bg-white p-10 rounded-xl shadow-lg w-[420px] text-center">
        <h2 class="text-2xl font-bold text-slate-800 mb-3">Quên mật khẩu</h2>
        <p class="text-sm text-slate-600 mb-6 px-4">Nhập email mà bạn đã dùng để tạo tài khoản. Chúng tôi sẽ gửi liên kết đặt lại mật khẩu</p>

        <form method="post" class="text-left">
            {% csrf_token %}
            <div class="mb-6">
                <label class="block text-sm font-bold text-slate-700 mb-2">Email khôi phục</label>
                <input type="email" name="email" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:border-blue-500" placeholder="youremail@example.com" required>
                {{ form.email.errors }}
            </div>
            <button type="submit" class="w-full bg-[#ea4335] hover:bg-[#d33426] text-white font-bold py-3 rounded-lg mb-4">Gửi liên kết khôi phục</button>
        </form>
        <a href="{% url 'login' %}" class="text-sm font-medium text-blue-500 hover:underline">Quay lại đăng nhập</a>
    </div>
</body>
</html>
